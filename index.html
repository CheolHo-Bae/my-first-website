    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;

      margin-bottom: 10px;

    .modal-close {
      position: absolute;

      font-size: 30px;
      color: #fff;

    }
      /*=======================================추가한부분 */
      /* 조작 버튼 스타일 */
      .nav-btn {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(0, 0, 0, 0.3);
        color: white;
        border: none;
        padding: 20px 15px;
        cursor: pointer;
        font-size: 30px;
        border-radius: 5px;
        z-index: 100;
        transition: background 0.3s;
      }
      .nav-btn:hover { background: rgba(0, 0, 0, 0.7); }
      .prev { left: 20px; }  /* 왼쪽 버튼 */
      .next { right: 20px; } /* 오른쪽 버튼 */

  <div class="carousel-container">

    <button class="nav-btn prev" onclick="manualRotate(-1)">&#10094;</button>

      // 사용자가 버튼을 눌러 직접 회전시킬 때 사용
      function manualRotate(dir) {
      // 1. 일단 자동 회전을 멈춤 (방해되지 않게)
        clearInterval(autoRotate);
        
        // 2. 원하는 방향으로 회전
        rotate(dir);
        
        // 3. 5초 후에 다시 자동 회전 시작 (선택 사항)
        autoRotate = setInterval(() => rotate(1), 3000);
      }
// 기존 rotate 함수 수정 (좌표 유지 확인)
function rotate(dir) {

    const carousel = document.getElementById('carousel');
    const angle = 360 / books.length;
    let currRotate = 0;
    let autoRotate; // 변수 먼저 선언
    books.forEach((book, i) => {
      const el = document.createElement('div');
      el.className = 'book';
      el.style.transform = `rotateY(${i * angle}deg) translateZ(500px)`;
      el.setAttribute('data-title', book.title);
      el.setAttribute('data-desc', book.desc);
      el.setAttribute('data-img', book.img);
      if (book.video) el.setAttribute('data-video', book.video);
      if (book.details) el.setAttribute('data-details', JSON.stringify(book.details));
      el.innerHTML = `<img src="${book.img}" alt="${book.title}" />`;
      el.addEventListener('click', openModal);
      carousel.appendChild(el);
    });
      
    /*=======================================내용 수정한분 */
    // 기존 rotate 함수 수정 (좌표 유지 확인)
    function rotate(dir) {
      currRotate += dir * angle;
      // top: 20px 설정을 유지하기 위해 translateY 값은 0으로 설정
      carousel.style.transform = `translate(-50%, -50%) rotateY(${currRotate}deg)`;
    }
    let autoRotate = setInterval(() => rotate(-1), 2500);
    function openModal(e) {
      const book = e.currentTarget;
      const img = book.getAttribute('data-img');
      const title = book.getAttribute('data-title');
      const desc = book.getAttribute('data-desc');
      const video = book.getAttribute('data-video');
      const details = JSON.parse(book.getAttribute('data-details') || '[]');
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalDesc').textContent = desc;
      const modalMedia = document.getElementById('modalMedia');
      const modalImages = document.getElementById('modalImages');
      modalMedia.innerHTML = '';
      modalImages.innerHTML = '';
      if (video) {
        modalMedia.innerHTML = `<iframe src="${video}" frameborder="0" allowfullscreen></iframe>`;
      } else {
        modalMedia.innerHTML = `<img src="${img}" class="detail-image" />`;
      }
      details.forEach(url => {
        modalImages.innerHTML += `<img src="${url}" class="detail-image" />`;
      });
      document.getElementById('bookModal').style.display = 'block';
    }
    function closeModal() {
      document.getElementById('bookModal').style.display = 'none';
      document.getElementById('modalMedia').innerHTML = ''; // 영상 정지
    }
  
      // ESC 키 누르면 모달 닫기

      // 모달 바깥쪽(바탕화면) 클릭 시 닫기

      // 클릭한 대상이 모달창의 흰색 컨텐츠가 아니라 어두운 배경(modal 자체)일 때만 닫음
      if (event.target == modal) {
