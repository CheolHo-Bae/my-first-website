<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>플라워스터디 - 도서출판 수풀미디어</title>
  <style>
    body {
      margin: 0; padding: 0;
      background: #f5f5f5;
      font-family: sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .carousel-container {
      perspective: 1400px;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    .carousel {
      width: 100%;
      height: 100%;
      position: absolute;
      /* 중앙 유지를 원하시면 top: 50%, 아니면 20px 등으로 수정 가능 */
      top: 50%; 
      left: 50%;
      transform-style: preserve-3d;
      transform: translate(-50%, -50%) rotateY(0deg);
      transition: transform 1s;
    }

    .book {
      width: 220px;
      height: 320px;
      position: absolute;
      top: 50%;
      left: 50%;
      margin-left: -110px; /* 가로 절반 */
      margin-top: -160px;  /* 세로 절반 */
      transform-style: preserve-3d;
      transition: transform 0.5s;
      cursor: pointer;
    }

    .book img {
      width: 100%; height: 100%;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    /* 버튼 스타일 */
    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.3);
      color: white;
      border: none;
      padding: 20px 15px;
      cursor: pointer;
      font-size: 30px;
      border-radius: 5px;
      z-index: 100;
    }
    .nav-btn:hover { background: rgba(0, 0, 0, 0.7); }
    .prev { left: 20px; }
    .next { right: 20px; }

    /* 모달 스타일 */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.7);
      z-index: 1000;
      overflow-y: auto;
    }
    .modal-content {
      background: #fff;
      margin: 5% auto;
      padding: 20px;
      max-width: 700px;
      border-radius: 10px;
      position: relative;
    }
    .modal-content iframe, .modal-content img.detail-image {
      width: 100%; border-radius: 8px; margin-bottom: 10px;
    }
    .modal-close {
      position: absolute;
      top: 10px; right: 20px;
      font-size: 30px; cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="carousel-container">
    <div class="carousel" id="carousel"></div>
    <button class="nav-btn prev" onclick="manualRotate(-1)">&#10094;</button>
    <button class="nav-btn next" onclick="manualRotate(1)">&#10095;</button>
  </div>

  <div class="modal" id="bookModal">
    <span class="modal-close" onclick="closeModal()">&times;</span>
    <div class="modal-content">
      <div id="modalMedia"></div>
      <h2 id="modalTitle"></h2>
      <p id="modalDesc"></p>
      <div id="modalImages"></div>
    </div>
  </div>

  <script>
    const books = [
      { title: "2026 화훼장식기능사 필기&실기", desc: "필기×실기×미니북 구성의 수험서. CBT 모의고사 포함!", img: "https://cheolho-bae.github.io/my-first-website/images/k_ps_1.jpg", video: "https://www.youtube.com/embed/dQw4w9WgXcQ", details: ["https://cheolho-bae.github.io/my-first-website/images/k_ps_1.jpg", "https://cheolho-bae.github.io/my-first-website/images/k_ps_1_intro.jpg"] },
      { title: "2026 화훼장식기능사 필기 합격보장 (영상)", desc: "필기×미니북 구성 수험서. 유튜브 영상 수록!", img: "https://cheolho-bae.github.io/my-first-website/images/k_p_1.jpg", video: "https://www.youtube.com/embed/dQw4w9WgXcQ", details: ["https://cheolho-bae.github.io/my-first-website/images/k_p_1.jpg", "https://cheolho-bae.github.io/my-first-website/images/k_p_1_intro.jpg"] },
      { title: "2026 화훼장식기사 필기&실기", desc: "기출문제 분석으로 단기간 학습가능", img: "https://cheolho-bae.github.io/my-first-website/images/kisa_ps_1.jpg" },
      { title: "2026 화훼장식산업기사 필기&실기", desc: "필기×실기 구성의 수험서", img: "https://cheolho-bae.github.io/my-first-website/images/sank_ps_1.jpg" },
      { title: "Peony 카드", desc: "수풀미디어의 감성 일러스트 카드", img: "https://cheolho-bae.github.io/my-first-website/images/card.jpg" }
      // ... 필요한 만큼 추가 가능
    ];

    const carousel = document.getElementById('carousel');
    const angle = 360 / books.length;
    let currRotate = 0;

    // 책 생성
    books.forEach((book, i) => {
      const el = document.createElement('div');
      el.className = 'book';
      el.style.transform = `rotateY(${i * angle}deg) translateZ(500px)`;
      el.innerHTML = `<img src="${book.img}" alt="${book.title}" />`;
      el.onclick = () => openModal(book);
      carousel.appendChild(el);
    });

    function rotate(dir) {
      currRotate += dir * angle;
      // 중앙 유지를 위해 translate(-50%, -50%) 사용
      carousel.style.transform = `translate(-50%, -50%) rotateY(${currRotate}deg)`;
    }

    let autoRotate = setInterval(() => rotate(-1), 3000);

    function manualRotate(dir) {
      clearInterval(autoRotate);
      rotate(dir);
      autoRotate = setInterval(() => rotate(-1), 3000);
    }

    function openModal(book) {
      document.getElementById('modalTitle').textContent = book.title;
      document.getElementById('modalDesc').textContent = book.desc;
      const modalMedia = document.getElementById('modalMedia');
      const modalImages = document.getElementById('modalImages');
      modalMedia.innerHTML = book.video ? `<iframe src="${book.video}" frameborder="0" allowfullscreen height="315"></iframe>` : `<img src="${book.img}" class="detail-image" />`;
      modalImages.innerHTML = '';
      if (book.details) {
        book.details.forEach(url => {
          modalImages.innerHTML += `<img src="${url}" class="detail-image" />`;
        });
      }
      document.getElementById('bookModal').style.display = 'block';
    }

    function closeModal() {
      document.getElementById('bookModal').style.display = 'none';
      document.getElementById('modalMedia').innerHTML = ''; // 영상 정지
    }

    // 전역 이벤트 리스너 (함수 밖으로 꺼냄)
    window.onclick = (e) => {
      if (e.target == document.getElementById('bookModal')) closeModal();
    };
    window.onkeydown = (e) => {
      if (e.key === "Escape") closeModal();
    };
  </script>
</body>
</html>
